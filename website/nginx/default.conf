server {
    listen 80;
    listen [::]:80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;
    charset utf-8;
    server_tokens off;

    gzip on;
    gzip_min_length 1024;
    gzip_types text/css application/javascript application/json image/svg+xml;

    # Achtung: add_header in einer location ersetzt die Header des Servers →
    # Sicherheits-Header deshalb in jeder location mit eigenem add_header erneut einbinden.
    include /etc/nginx/snippets/security-headers.conf;

    location = /healthz {
        access_log off;
        default_type text/plain;
        return 200 "ok\n";
    }

    # Wird beim Containerstart aus Umgebungsvariablen erzeugt
    location = /config.js {
        include /etc/nginx/snippets/security-headers.conf;
        add_header Cache-Control "no-cache" always;
    }

    location /assets/ {
        include /etc/nginx/snippets/security-headers.conf;
        add_header Cache-Control "public, max-age=86400" always;
    }

    # Manifest der aktuellen Version – nie zwischenspeichern
    location = /downloads/latest.json {
        alias /downloads/latest.json;
        default_type application/json;
        include /etc/nginx/snippets/security-headers.conf;
        add_header Cache-Control "no-store" always;
    }

    # Setup & Prüfsummen (Volume). Kein Verzeichnislisting.
    location /downloads/ {
        alias /downloads/;
        autoindex off;
        include /etc/nginx/snippets/security-headers.conf;
        add_header Cache-Control "no-cache" always;
        # versteckte Dateien (z. B. laufender Abgleich) nie ausliefern
        location ~ /\. { deny all; }
    }

    location / {
        try_files $uri $uri/ =404;
    }
}
